<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>EKORUSTIKA DATA HUB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--b:#00d4ff;--g:#39ff88;--t:#fff;--m:#9aa4ad;--c:#0b0f14;--l:#1c2630}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px;padding:10px 14px}
header img{width:38px;height:38px;border-radius:9px}header h1{font-size:17px;margin:0;letter-spacing:1px}header small{display:block;color:var(--m);font-size:11px;font-weight:400}
#back{display:none;background:none;border:1px solid var(--l);color:var(--t);border-radius:10px;padding:8px 12px;font-size:16px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.warn{border:1px solid #ffb84d55;background:#ffb84d12;color:#ffd9a0;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px 12px;min-height:104px;color:var(--t);font-size:16px;font-weight:700;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.tile span{font-size:28px}.tile em{font-style:normal;font-size:12px;color:var(--m);font-weight:400}
.tile.b{border-color:#00d4ff66;box-shadow:0 0 14px #00d4ff22}.tile.g{border-color:#39ff8866;box-shadow:0 0 14px #39ff8822}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 4px}
input,select,textarea{width:100%;background:#05080b;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:120px}
.btn{display:inline-block;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;margin:6px 6px 0 0;background:var(--b);color:#001018;cursor:pointer;text-decoration:none}
.btn.g{background:var(--g);color:#00140a}.btn.o{background:none;color:var(--t);border:1px solid var(--l)}.btn.r{background:none;color:#ff6b6b;border:1px solid #ff6b6b66}
.btn.full{width:100%;margin:8px 0 0}
.row{display:flex;flex-wrap:wrap;gap:0}.muted{color:var(--m);font-size:13px}
video{width:100%;border-radius:10px;background:#111;max-height:60vh}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chip{flex:0 0 auto;border:1px solid var(--l);background:none;color:var(--t);border-radius:20px;padding:8px 14px;font-size:14px}
.chip.on{border-color:var(--b);color:var(--b)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph{position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.tag{position:absolute;left:6px;top:6px;background:#000c;border:1px solid var(--b);color:var(--b);font-size:11px;padding:2px 7px;border-radius:8px}
.tag.p{border-color:var(--g);color:var(--g)}
.ph select{margin-top:4px;padding:6px;font-size:13px}
.status{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--l);color:var(--m)}
#lb{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center}#lb img{max-width:100%;max-height:100%}#lb button{position:absolute;top:12px;right:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;border:1px solid var(--b);padding:10px 16px;border-radius:12px;display:none;z-index:30}
a{color:var(--b)}
</style>
</head>
<body>
<header><button id="back" onclick="go('home')">←</button><img src="icon-192.png" alt="EKORUSTIKA logo"><h1>EKORUSTIKA DATA HUB<small>Upravljačko sučelje EKORUSTIKA GROUP · v1.0 MVP</small></h1></header>
<main id="app"></main>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""><button class="btn o">✕</button></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
